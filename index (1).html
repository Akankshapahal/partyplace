<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PartyPlace – Your Party. Your Place. Your Choice.</title>
<style>
:root{--p:#5B3FD8;--pd:#4529b8;--lav:#EEE9FF;--co:#FF6B57;--bg:#fff;--tx:#1d1738;--mu:#6b6590;--card:#fff;--bd:#e6e0fb;--sh:0 8px 30px rgba(91,63,216,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120e24;--tx:#f1eeff;--mu:#a9a2d0;--card:#1c1636;--bd:#2d2552;--lav:#241c47;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120e24;--tx:#f1eeff;--mu:#a9a2d0;--card:#1c1636;--bd:#2d2552;--lav:#241c47;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.2;margin:0 0 .5em}h2{font-size:clamp(1.5rem,3vw,2.1rem)}p{margin:.3em 0}.mu{color:var(--mu);font-size:.92rem}
.w{max-width:1180px;margin:auto;padding:0 20px}section{padding:56px 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;gap:18px;height:66px}.logo{font-weight:800;font-size:1.35rem;color:var(--p)}.logo b{color:var(--co)}
.links{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}.links a{padding:8px 12px;border-radius:10px;font-weight:500;font-size:.93rem}.links a:hover,.links a.on{background:var(--lav);color:var(--p)}
.burger{display:none;margin-left:auto;background:none;border:0;font-size:1.6rem;color:var(--tx)}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;padding:12px 22px;border-radius:14px;font-weight:600;cursor:pointer;font-size:.95rem;transition:.2s;font-family:inherit}.btn:hover{background:var(--pd);transform:translateY(-2px);box-shadow:var(--sh)}
.btn.co{background:var(--co)}.btn.gh{background:var(--lav);color:var(--p)}.btn.sm{padding:8px 14px;font-size:.85rem;border-radius:10px}.btn.wh{background:#fff;color:var(--p)}
.hero{background:linear-gradient(135deg,#5B3FD8,#8a6cff 60%,#FF6B57);color:#fff;padding:80px 0 90px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);max-width:760px}.hero p{font-size:1.15rem;opacity:.92;max-width:560px}
.sb{display:flex;gap:10px;background:var(--card);padding:10px;border-radius:18px;max-width:680px;margin-top:28px;box-shadow:0 20px 50px rgba(0,0,0,.25);flex-wrap:wrap}
.sb input,.sb select{flex:1;min-width:140px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid var(--p)}
.sb input{border:0}label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden;transition:.25s;position:relative}
.vc:hover,.cat:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(91,63,216,.22)}.vc{display:block}
.img{height:180px;display:grid;place-items:center;font-size:4rem}.cb{padding:16px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fav{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#aaa;font-size:1.1rem;cursor:pointer;transition:.2s}.fav.on{color:var(--co)}.fav:hover{transform:scale(1.15)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.cat{padding:24px 12px;text-align:center;font-weight:600;cursor:pointer;display:block}.cat span{display:block;font-size:2.2rem}
.alt{background:var(--lav)}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.pad{padding:22px}
.cta{background:linear-gradient(135deg,var(--p),var(--co));color:#fff;border-radius:28px;padding:48px;text-align:center}
.badge{display:inline-block;background:#fff1ef;color:#d6402c;border:1px dashed var(--co);padding:5px 12px;border-radius:99px;font-weight:700;font-size:.8rem}
.st{padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:700}.Pending{background:#fff4d6;color:#8a6100}.Confirmed{background:#dcf8e6;color:#12713a}.Rejected{background:#ffe1e1;color:#b32020}
.stat{font-size:1.9rem;font-weight:800;color:var(--p)}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:10px}.gal div{border-radius:18px;display:grid;place-items:center;font-size:4rem;min-height:130px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--lav);color:var(--p);padding:6px 14px;border-radius:99px;font-size:.85rem;font-weight:600}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;padding:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:14px;z-index:50;box-shadow:var(--sh)}
footer{background:#1d1738;color:#cfc8f5;padding:44px 0 24px;margin-top:40px}footer a{display:block;padding:3px 0;opacity:.85}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:.92rem}
.fi{opacity:0;transform:translateY(22px);transition:.7s}.fi.in{opacity:1;transform:none}
@media(max-width:820px){.burger{display:block}.links{display:none;position:absolute;top:66px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;padding:12px;border-bottom:1px solid var(--bd)}.links.open{display:flex}.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.cta{padding:30px 18px}.gal{grid-template-columns:1fr}.hero{padding:56px 0}}
.tw{overflow-x:auto}
</style></head><body>
<nav><div class="w"><a class="logo" href="#home">Party<b>Place</b> 🎉</a><button class="burger" id="bg" aria-label="Menu">☰</button><div class="links" id="lk"></div></div></nav>
<main id="app"></main>
<footer><div class="w g3"><div><div class="logo" style="color:#fff">Party<b>Place</b></div><p class="mu" style="color:#b7aee6">Your Party. Your Place. Your Choice.</p><p class="mu" style="color:#b7aee6">Demo website – no real payments.</p></div><div><b>Explore</b><a href="#explore">Browse spaces</a><a href="#host">Become a host</a><a href="#about">About</a></div><div><b>Support</b><a href="#contact">Contact</a><a href="#login">Login / Signup</a><a href="#bookings">My bookings</a></div></div><div class="w mu" style="margin-top:24px;color:#9e95d6">© 2026 PartyPlace · Panipat · Karnal · Sonipat · Delhi</div></footer>
<script>
const V0=[
{id:'v1',name:'Green Leaf Farmhouse',type:'Farmhouse',loc:'Panipat',price:3500,cap:150,r:4.8,h:140,e:'🌳',d:'A sprawling green farmhouse with a lawn, pool and open-air stage, perfect for birthdays and family functions.',am:['Swimming pool','Parking','DJ sound','Garden lawn','Kitchen access']},
{id:'v2',name:'Royal Villa Karnal',type:'Villa',loc:'Karnal',price:4800,cap:80,r:4.9,h:265,e:'🏰',d:'An elegant villa with grand interiors, lounge area and a private courtyard for classy celebrations.',am:['AC rooms','Lounge','Parking','Courtyard','Decor allowed']},
{id:'v3',name:'Skyline Rooftop Lounge',type:'Rooftop',loc:'Delhi',price:6500,cap:60,r:4.7,h:300,e:'🌆',d:'A rooftop with city skyline views, fairy lights and a sunset deck for cocktail parties and proposals.',am:['Skyline view','Fairy lights','Bar counter','Sound system','Lift']},
{id:'v4',name:'Sapphire Banquet Hall',type:'Private Hall',loc:'Sonipat',price:5200,cap:250,r:4.6,h:215,e:'🥂',d:'A modern air-conditioned hall with stage, LED wall and spacious dining for weddings and receptions.',am:['AC hall','Stage + LED','Catering area','Valet parking','Generator']},
{id:'v5',name:'The Loft Studio',type:'Studio',loc:'Delhi',price:2800,cap:40,r:4.5,h:20,e:'🎨',d:'A bright creative studio with exposed brick, perfect for small parties, shoots and pop-up events.',am:['Natural light','Wi-Fi','Projector','Bluetooth speakers']},
{id:'v6',name:'Sunset Farm Retreat',type:'Farmhouse',loc:'Sonipat',price:3000,cap:120,r:4.4,h:35,e:'🌇',d:'A peaceful farm retreat with bonfire pit, open ground and a rustic cabin for night parties.',am:['Bonfire pit','Open ground','Cabin','Parking','Barbecue']},
{id:'v7',name:'Orchid Terrace',type:'Rooftop',loc:'Panipat',price:2500,cap:50,r:4.3,h:330,e:'🌸',d:'A cosy flower-themed terrace ideal for anniversaries, baby showers and kitty parties.',am:['Flower decor','Seating','Sound system','Washroom']},
{id:'v8',name:'Crystal Palace Hall',type:'Private Hall',loc:'Karnal',price:4200,cap:180,r:4.6,h:190,e:'💎',d:'A glamorous hall with crystal chandeliers and a dance floor for engagements and big celebrations.',am:['Chandeliers','Dance floor','AC','Parking','Green rooms']}];
const TY=['Farmhouse','Villa','Rooftop','Private Hall','Studio'],IC={Farmhouse:'🌳',Villa:'🏰',Rooftop:'🌆','Private Hall':'🥂',Studio:'🎨'};
const REV=[['Aarav S.','Amazing place, host was super helpful. Our party was a hit!',5],['Neha K.','Clean, spacious and exactly as shown. Would book again.',4]];
const TEST=[['Simran, Karnal','Found a gorgeous villa for my sister’s engagement in minutes.'],['Rohit, Delhi','Listed my rooftop and got three requests in a week.'],['Pooja, Panipat','Simple booking flow and no hidden surprises.']];
let S={users:[],me:null,bk:[],fav:[],vn:[]},F={q:'',t:'',b:0,c:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('pp')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pp',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),all=()=>V0.concat(S.vn),vid=i=>all().find(v=>v.id===i);
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad=v=>`background:linear-gradient(135deg,hsl(${v.h} 70% 55%),hsl(${(v.h+50)%360} 75% 68%))`;
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const card=v=>`<a class="card vc" href="#venue-${v.id}"><div class="img" style="${grad(v)}">${v.e}</div><button class="fav ${S.fav.includes(v.id)?'on':''}" data-f="${v.id}" aria-label="Save venue">♥</button><div class="cb"><div class="row"><b>${esc(v.name)}</b><span>★ ${v.r}</span></div><p class="mu">📍 ${esc(v.loc)} · ${esc(v.type)}</p><p class="mu">👥 Up to ${v.cap} guests</p><p><b>${money(v.price)}</b><span class="mu"> / hour</span></p></div></a>`;
const st=s=>`<span class="st ${s}">${s}</span>`;
function nav(){const p=(location.hash||'#home').slice(1).split('-')[0],L=[['home','Home'],['explore','Explore'],['host','Become a Host'],['about','About'],['contact','Contact']];
if(S.me){L.push(['bookings','My Bookings'],[S.me.role==='host'?'hostdash':'guestdash','Dashboard'])}
$('#lk').innerHTML=L.map(l=>`<a href="#${l[0]}" class="${p===l[0]?'on':''}">${l[1]}</a>`).join('')+(S.me?`<a href="#" data-act="out">Logout (${esc(S.me.name.split(' ')[0])})</a>`:'<a class="btn sm" href="#login">Login / Signup</a>')}
const pages={
home(){const f=all();return`<div class="hero"><div class="w"><h1>Your Party. Your Place. Your Choice.</h1><p>Discover and book farmhouses, villas, rooftops and halls across Panipat, Karnal, Sonipat and Delhi.</p><form class="sb" id="hs"><input id="hq" placeholder="🔍 Search by city or venue" style="color:var(--tx)"><button class="btn co">Search</button></form></div></div>
<section><div class="w fi"><h2>Browse by category</h2><div class="cats">${TY.map(t=>`<a class="card cat" href="#explore" data-cat="${t}"><span>${IC[t]}</span>${t==='Villa'||t==='Studio'?t+'s':t==='Farmhouse'?'Farmhouses':t==='Rooftop'?'Rooftops':'Private Halls'}</a>`).join('')}</div></div></section>
<section class="alt"><div class="w fi"><h2>Featured venues</h2><div class="grid">${f.slice(0,4).map(card).join('')}</div></div></section>
<section><div class="w fi"><h2>Popular spaces</h2><div class="grid">${f.slice(4,8).map(card).join('')}</div></div></section>
<section class="alt"><div class="w fi"><h2>Why choose PartyPlace</h2><div class="g3">${[['✨','Verified spaces','Every listing shows clear amenities, rules and capacity.'],['💬','Direct requests','Send a booking request straight to the host.'],['🏷️','Transparent pricing','See your estimated total before you request.'],['📱','Works everywhere','Book from your phone, tablet or laptop.']].map(x=>`<div class="card pad"><div style="font-size:2rem">${x[0]}</div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></div>`).join('')}</div></div></section>
<section><div class="w fi"><div class="cta"><h2>Got a space? Start earning.</h2><p>List your venue for free and manage booking requests from one dashboard.</p><br><a class="btn wh" href="#host">Become a host</a></div></div></section>
<section class="alt"><div class="w fi"><h2>Loved by hosts and guests</h2><div class="g3">${TEST.map(t=>`<div class="card pad"><p>“${t[1]}”</p><p class="mu"><b>${t[0]}</b> ★★★★★</p></div>`).join('')}</div></div></section>`},
explore(){const cap=`<option value="0">Any capacity</option>`+[50,100,200].map(n=>`<option value="${n}" ${F.c==n?'selected':''}>${n}+ guests</option>`).join('');
return`<section><div class="w"><h2>Explore spaces</h2><div class="card filters"><input id="fq" placeholder="Search name or location" value="${esc(F.q)}"><select id="ft"><option value="">All types</option>${TY.map(t=>`<option ${F.t===t?'selected':''}>${t}</option>`).join('')}</select><select id="fb"><option value="0">Any budget</option>${[3000,5000,7000].map(n=>`<option value="${n}" ${F.b==n?'selected':''}>Up to ${money(n)}/hr</option>`).join('')}</select><select id="fc">${cap}</select></div><br><p class="mu" id="cnt"></p><div class="grid" id="eg"></div></div></section>`},
venue(id){const v=vid(id);if(!v)return pages.nf();const mn=today(),own=S.users.find(u=>u.id===v.o);
return`<section><div class="w"><div class="gal"><div style="${grad(v)};min-height:300px;font-size:7rem">${v.e}</div><div style="${grad({h:v.h+40})}">${v.e}</div></div><br><div class="two"><div><div class="row"><h1>${esc(v.name)}</h1><button class="btn gh sm" data-f="${v.id}">${S.fav.includes(v.id)?'♥ Saved':'♡ Save'}</button></div><p class="mu">📍 ${esc(v.loc)} · ${esc(v.type)} · ★ ${v.r} · 👥 Up to ${v.cap} guests</p><h3>About this space</h3><p>${esc(v.d)}</p><h3>Amenities</h3><div class="chips">${v.am.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div><h3 style="margin-top:20px">House rules</h3><p class="mu">No loud music after 11 PM · No smoking indoors · Cleaning is the guest’s responsibility · Respect neighbours.</p><h3>Hosted by</h3><p>${own?esc(own.name):'PartyPlace Demo Host'} <span class="mu">· Usually replies within a day</span></p><h3>Reviews</h3>${REV.map(r=>`<div class="card pad" style="margin-bottom:10px"><b>${r[0]}</b> ${'★'.repeat(r[2])}<p class="mu">${r[1]}</p></div>`).join('')}</div>
<form class="card pad" id="bf" data-v="${v.id}"><h3>${money(v.price)} <span class="mu">/ hour</span></h3><label>Date</label><input type="date" name="date" min="${mn}" required><label>Start time</label><input type="time" name="time" value="18:00" required><label>Hours</label><input type="number" name="hours" min="1" max="24" value="4" required><label>Guests (max ${v.cap})</label><input type="number" name="guests" min="1" max="${v.cap}" value="20" required><br><br><button class="btn" style="width:100%">Send booking request</button><p class="mu">Demo only – no real payment.</p></form></div></div></section>`},
host(){return`<section><div class="w"><div class="cta"><h1>Turn your space into income</h1><p>Create a free host account, list your venue and approve requests on your terms.</p><br><a class="btn wh" href="#${S.me&&S.me.role==='host'?'hostdash':'login'}">${S.me&&S.me.role==='host'?'Go to host dashboard':'Sign up as a host'}</a></div><br><div class="g3">${[['1','Create account','Sign up as a host in seconds.'],['2','Add your venue','Set price, capacity and facilities.'],['3','Approve bookings','Accept or reject requests.']].map(x=>`<div class="card pad"><div class="stat">${x[0]}</div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></div>`).join('')}</div></div></section>`},
hostdash(){if(!S.me||S.me.role!=='host')return gate('host');const mine=S.vn.filter(v=>v.o===S.me.id),ids=mine.map(v=>v.id).concat(V0.map(v=>v.id)),rq=S.bk.filter(b=>ids.includes(b.v)),tot=b=>vid(b.v).price*b.hours,ap=rq.filter(b=>b.s==='Confirmed');
return`<section><div class="w"><div class="row"><h2>Host dashboard</h2></div><div class="g3">${[['Total listings',mine.length],['Pending requests',rq.filter(b=>b.s==='Pending').length],['Approved bookings',ap.length],['Estimated earnings',money(ap.reduce((a,b)=>a+tot(b),0))+' *']].map(x=>`<div class="card pad"><p class="mu">${x[0]}</p><div class="stat">${x[1]}</div></div>`).join('')}</div><p class="mu">* Display only. Demo venues also send you requests so you can test the full flow.</p><br><h3>Booking requests</h3><div class="card pad tw"><table><tr><th>Venue</th><th>Date</th><th>Guests</th><th>Total</th><th>Status</th><th></th></tr>${rq.length?rq.map(b=>`<tr><td>${esc(vid(b.v).name)}</td><td>${b.date} ${b.time}</td><td>${b.guests}</td><td>${money(tot(b))}</td><td>${st(b.s)}</td><td>${b.s==='Pending'?`<button class="btn sm" data-act="ap" data-id="${b.id}">Accept</button> <button class="btn sm gh" data-act="rj" data-id="${b.id}">Reject</button>`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="mu">No requests yet.</td></tr>'}</table></div><br><h3>Add new venue</h3><form class="card pad" id="vf"><div class="g3"><div><label>Venue name</label><input name="name" required></div><div><label>Venue type</label><select name="type">${TY.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>Location</label><input name="loc" required></div><div><label>Price per hour (₹)</label><input type="number" name="price" min="100" required></div><div><label>Capacity</label><input type="number" name="cap" min="1" required></div><div><label>Facilities (comma separated)</label><input name="am" placeholder="Parking, DJ, AC"></div></div><label>Description</label><textarea name="d" rows="3" required></textarea><label>Image URL (optional – a colour placeholder is used)</label><input name="img" placeholder="https://…"><br><br><button class="btn co">+ Add venue</button></form>${mine.length?`<br><h3>Your listings</h3><div class="grid">${mine.map(card).join('')}</div>`:''}</div></section>`},
guestdash(){if(!S.me)return gate('guest');const my=S.bk.filter(b=>b.u===S.me.id),up=my.filter(b=>b.s==='Confirmed'&&b.date>=today()),pe=my.filter(b=>b.s==='Pending'),dn=my.filter(b=>b.s==='Confirmed'&&b.date<today()),sv=S.fav.map(vid).filter(Boolean);
return`<section><div class="w"><h2>Welcome, ${esc(S.me.name)} 👋</h2><div class="g3">${[['Upcoming bookings',up.length],['Pending requests',pe.length],['Completed bookings',dn.length],['Saved venues',sv.length]].map(x=>`<div class="card pad"><p class="mu">${x[0]}</p><div class="stat">${x[1]}</div></div>`).join('')}</div><br><a class="btn" href="#bookings">View my bookings</a><br><br><h3>Saved venues</h3>${sv.length?`<div class="grid">${sv.map(card).join('')}</div>`:'<p class="mu">Tap the ♥ on any venue to save it.</p>'}</div></section>`},
bookings(){if(!S.me)return gate('guest');const my=S.bk.filter(b=>b.u===S.me.id).reverse();
return`<section><div class="w"><h2>My bookings</h2>${my.length?`<div class="card pad tw"><table><tr><th>Venue</th><th>Date</th><th>Hours</th><th>Guests</th><th>Status</th><th></th></tr>${my.map(b=>`<tr><td>${esc(vid(b.v).name)}</td><td>${b.date} ${b.time}</td><td>${b.hours}</td><td>${b.guests}</td><td>${st(b.s)}</td><td><a class="btn sm gh" href="#summary-${b.id}">Summary</a></td></tr>`).join('')}</table></div><p class="mu">Waiting? Log in as a host (any host account) and accept the request from the host dashboard.</p>`:'<p class="mu">No bookings yet. <a href="#explore" style="color:var(--p)">Explore spaces</a></p>'}</div></section>`},
summary(id){const b=S.bk.find(x=>x.id===id),v=b&&vid(b.v);if(!v)return pages.nf();const base=v.price*b.hours,fee=base*.08;
return`<section><div class="w" style="max-width:640px"><div class="card pad"><div class="row"><h2>Booking summary</h2>${st(b.s)}</div><span class="badge">Demo Only – No Real Payment</span><br><br><h3>${esc(v.name)}</h3><p class="mu">📍 ${esc(v.loc)} · ${b.date} at ${b.time} · ${b.guests} guests</p><table><tr><td>Venue price</td><td>${money(v.price)} / hr</td></tr><tr><td>Hours booked</td><td>${b.hours}</td></tr><tr><td>Subtotal</td><td>${money(base)}</td></tr><tr><td>Service fee (8%, display only)</td><td>${money(fee)}</td></tr><tr><td><b>Estimated total</b></td><td><b>${money(base+fee)}</b></td></tr></table><p class="mu">${b.s==='Confirmed'?'🎉 Your booking is confirmed by the host. Have a great party!':b.s==='Pending'?'⏳ Waiting for the host to approve your request.':'This request was declined. Try another venue.'}</p><a class="btn" href="#bookings">Back to my bookings</a></div></div></section>`},
about(){return`<section><div class="w" style="max-width:760px"><h2>About PartyPlace</h2><p>PartyPlace is a marketplace connecting people who need a place to celebrate with hosts who have great spaces. From farmhouse birthdays to rooftop anniversaries, we make private event venues in Panipat, Karnal, Sonipat and Delhi easy to find and book.</p><p>This is a demo build: everything is stored in your browser and no real payments are taken.</p><br><a class="btn" href="#explore">Find a space</a></div></section>`},
contact(){return`<section><div class="w" style="max-width:620px"><h2>Contact us</h2><form class="card pad" id="cf"><label>Name</label><input required><label>Email</label><input type="email" required><label>Message</label><textarea rows="4" required></textarea><br><br><button class="btn">Send message</button></form></div></section>`},
login(){return`<section><div class="w" style="max-width:460px"><div class="card pad"><h2 id="lt">Welcome back</h2><form id="af"><div id="nm" style="display:none"><label>Full name</label><input name="name"></div><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="pw" minlength="4" required><div id="rl" style="display:none"><label>I want to</label><select name="role"><option value="guest">Book spaces (Guest)</option><option value="host">List my space (Host)</option></select></div><br><br><button class="btn" style="width:100%" id="sb">Login</button></form><p class="mu"><a href="#" id="tg" style="color:var(--p)">New here? Create an account</a></p></div></div></section>`},
nf(){return`<section><div class="w"><h2>Page not found</h2><a class="btn" href="#home">Go home</a></div></section>`}};
function gate(r){return`<section><div class="w"><div class="card pad"><h2>Please log in</h2><p class="mu">You need ${r==='host'?'a host':'an'} account to see this page.</p><br><a class="btn" href="#login">Login / Signup</a></div></div></section>`}
function grid(){const q=F.q.toLowerCase(),r=all().filter(v=>(!q||(v.name+v.loc+v.type).toLowerCase().includes(q))&&(!F.t||v.type===F.t)&&(!F.b||v.price<=F.b)&&(!F.c||v.cap>=F.c));$('#eg').innerHTML=r.map(card).join('')||'<p class="mu">No spaces match. Try changing the filters.</p>';$('#cnt').textContent=r.length+' spaces found'}
let io;function route(){const h=(location.hash||'#home').slice(1),i=h.indexOf('-'),p=i<0?h:h.slice(0,i),id=i<0?'':h.slice(i+1);
$('#app').innerHTML=(pages[p]||pages.nf)(id);$('#lk').classList.remove('open');nav();window.scrollTo(0,0);if(p==='explore')grid();if(p==='login')authUI();
io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.fi').forEach(e=>io.observe(e))}
let reg=false;function authUI(){const f=$('#af'),set=()=>{$('#nm').style.display=$('#rl').style.display=reg?'block':'none';$('#lt').textContent=reg?'Create your account':'Welcome back';$('#sb').textContent=reg?'Sign up':'Login';$('#tg').textContent=reg?'Have an account? Login':'New here? Create an account'};set();$('#tg').onclick=e=>{e.preventDefault();reg=!reg;set()};
f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),em=d.email.toLowerCase();
if(reg){if(S.users.some(u=>u.email===em))return toast('Email already registered');const u={id:'u'+Date.now(),name:d.name||'Friend',email:em,pw:d.pw,role:d.role};S.users.push(u);S.me=u}
else{const u=S.users.find(x=>x.email===em&&x.pw===d.pw);if(!u)return toast('Wrong email or password');S.me=u}
save();toast('Welcome, '+S.me.name+'!');location.hash=S.me.role==='host'?'#hostdash':'#guestdash'}}
document.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){e.preventDefault();e.stopPropagation();const i=f.dataset.f,x=S.fav.indexOf(i);x<0?S.fav.push(i):S.fav.splice(x,1);save();toast(x<0?'Saved to favourites':'Removed from favourites');if(!f.classList.contains('btn')){f.classList.toggle('on')}else f.textContent=x<0?'♥ Saved':'♡ Save';return}
const c=e.target.closest('[data-cat]');if(c){F={q:'',t:c.dataset.cat,b:0,c:0}}
const a=e.target.closest('[data-act]');if(a){e.preventDefault();const k=a.dataset.act;if(k==='out'){S.me=null;save();location.hash='#home';route()}else{const b=S.bk.find(x=>x.id===a.dataset.id);if(b){b.s=k==='ap'?'Confirmed':'Rejected';save();toast('Request '+b.s.toLowerCase());route()}}}
if(e.target.id==='bg')$('#lk').classList.toggle('open')});
document.addEventListener('input',e=>{const m={fq:'q',ft:'t',fb:'b',fc:'c'}[e.target.id];if(m){F[m]=['b','c'].includes(m)?+e.target.value:e.target.value;grid()}});
document.addEventListener('submit',e=>{const f=e.target,d=Object.fromEntries(new FormData(f));
if(f.id==='hs'){e.preventDefault();F={q:$('#hq').value,t:'',b:0,c:0};location.hash='#explore'}
if(f.id==='cf'){e.preventDefault();f.reset();toast('Message sent (demo). We’ll be in touch!')}
if(f.id==='bf'){e.preventDefault();if(!S.me){toast('Please log in to book');location.hash='#login';return}const b={id:'b'+Date.now(),v:f.dataset.v,u:S.me.id,date:d.date,time:d.time,hours:+d.hours,guests:+d.guests,s:'Pending'};S.bk.push(b);save();toast('Booking request sent!');location.hash='#bookings'}
if(f.id==='vf'){e.preventDefault();const n=S.vn.length+1;S.vn.push({id:'c'+Date.now(),o:S.me.id,name:d.name,type:d.type,loc:d.loc,price:+d.price,cap:+d.cap,r:4.5,h:(n*67)%360,e:IC[d.type],d:d.d,am:(d.am||'Parking').split(',').map(s=>s.trim()).filter(Boolean)});save();toast('Venue added!');route()}});
$('#bg').onclick=()=>$('#lk').classList.toggle('open');
addEventListener('hashchange',route);route();
</script></body></html>
